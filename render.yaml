services:
  - type: web
    name: milpa-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: POSTGRES_HOST
        value: db.pgctvdcgcvkkqpvciesd.supabase.co
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_DB
        value: postgres
      - key: DB_SSLMODE
        value: require
      - key: POSTGRES_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: "8080"
      - key: REDIS_URL
        fromDatabase:
          name: milpa-redis
          property: connectionString
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        value: ""
      - key: ESCLIENT_USER
        sync: false
      - key: ESCLIENT_PASSWORD
        sync: false
      - key: ESCLIENT_ENDPOINT1
        sync: false
      - key: ESCLIENT_ENDPOINT2
        value: ""
      - key: ESCLIENT_MAXID
        value: "10"
      - key: ESCLIENT_INDEX
        value: "milpa-offerings"
    healthCheckPath: /api/v1/categories
    autoDeploy: true

databases:
  - name: milpa-redis
    type: keyvalue
    plan: free
    ipAllowList: []
